<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature</title>
</head>

<body>

    <div class="container">
        <form action="">
            <h2>Tempature Conversion</h2>
            <input id="textbox" type="number" value="0"><br>

            <input type="radio" name="unit" id="toFahrenhiet">
            <label for="toFahrenhiet">Celsius ➡️ Fahrenheit</label>
            <br>
            <input type="radio" name="unit" id="toCelsius">
            <label for="toCelsius">Fahrenheit ➡️ Celsius</label>
            <br>

            <input id="sbtn" type="button" value="Submit" onclick="convert()">

            <h3 id="result"></h3>

        </form>
    </div>

    <style>
        body {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow';
            height: 100vh;
            background: linear-gradient(to right, red, green, blue);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h2 {
            color: rgb(115, 8, 8);
        }

        .container {
            display: flex;
            justify-content: center;
            text-align: center;
            height: 245px;
            width: 255px;
            padding: 20px;
            border-radius: 40px;
            background-color: #f1eeee50;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.368);

        }

        #textbox {
            text-align: center;
            border-radius: 10px;
            box-sizing: content-box;
            border: none;
            height: 30px;
            width: 50px;
            border: 2px solid black;
            font-size: 20px;
            margin-bottom: 20px;
        }

        #sbtn {
            background-color: white;
            color: black;
            font-size: 15px;
            border: none;
            border-radius: 10px;
            margin-top: 15px;
            padding: 5px;
            cursor: pointer;

        }

        #sbtn:hover {
            background-color: orange;
        }
    </style>
    <script src="24tem.js"></script>
</body>

</html>
