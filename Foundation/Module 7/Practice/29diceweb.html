<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <h1>Dice Roller</h1>
        <label for=""># of dice:</label>
        <input type="number" id="numofDice" value="1" min="1">
        <button id="button" onclick="rollDice()" >Roll Dice</button>
        <div id="diceResult"></div>
        <div id="diceImages"></div>
    </div>

    <style>
        .container{
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            font-weight: bold;
            font-size: 2em;
            }
        #button{
            background-color: rgb(11, 43, 141);
            color: white;
            border-radius: 10px;
            border: none;
            padding: 10px;
            font-size: 1em;
            
        }
        input{
            font-size: 1em;
            width: 90px;
            text-align:center;
            border-radius: 10px;
            height: 50px;
            border: solid 1px gray;
        }

        #button:hover{
            background-color: rgb(255, 0, 0);
        }

         #button:active{
            background-color: rgb(18, 246, 147);
        }

    </style>
    <script src="29dice.js"></script>
</body>
</html>
