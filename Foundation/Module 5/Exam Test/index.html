<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing Explanation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2>Without border-box (content-box)</h2>
    <div class="box content-box">
        I am supposed to be 300px wide, but my padding and border make me wider!
    </div>

    <h2>With border-box</h2>
    <div class="box border-box">
        I am exactly 300px wide. My padding and border fit perfectly inside!
    </div>

</body>

</html>
